[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.121.0",
    "langgraph==1.0.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain-openai==1.0.0",
    "langchain-core==1.0.1",
    "langfuse==3.9.1",
    "uvicorn[standard]==0.38.0",
    "python-dotenv==1.2.1",
    "bs4>=0.0.2",
    "langchain>=1.0.2",
    "ruff>=0.16.4",
]

[project.optional-dependencies]
gateway = [
    "litellm[proxy]>=1.55.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "unit: isolated test of one function or class, no network and no LLM calls",
    "integration: several components together (SQLite, the compiled graph, the API)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["configs", "src", "main"]
omit = ["tests/*", "*/__pycache__/*"]
branch = true

[tool.coverage.report]
show_missing = true
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
